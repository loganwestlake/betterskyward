<!doctype html>
<html><head><meta charset="utf-8"><title>Family Access - Gradebook</title>
<style>body{font:12px Arial;background:#e9eef3} table{border-collapse:collapse} td,th{border:1px solid #bbb;padding:3px 6px} .wrap{display:flex}</style>
</head><body>
<!-- Mimics the Skyward SMS 2.0 gradebook DOM: frozen class table + scrolling grade table. -->
<div style="background:#1a1a1a;color:#eee;padding:12px 16px;font:14px Arial;margin-bottom:10px">
  <b>Practice page.</b> This is a fake Skyward gradebook with made-up grades, for testing.
  <button id="runGlow" style="margin-left:10px;padding:6px 12px;font-weight:bold;cursor:pointer">Run Skyward Glow</button>
  (or paste the code into the console, or click your bookmark)
</div>
<ul id="sf_navMenu" style="float:left;width:150px;list-style:none;padding:0;margin:0 10px 0 0;background:#2d4f73">
  <li><a data-nav="sfhome01.w" href="javascript:void(0)" style="color:#fff">Home</a></li>
  <li><a data-nav="sfcalendar001.w" href="javascript:void(0)" style="color:#fff">Calendar</a></li>
  <li><a data-nav="sfgradebook001.w" href="javascript:void(0)" style="color:#fff">Gradebook</a></li>
  <li><a data-nav="sfattendance001.w" href="javascript:void(0)" style="color:#fff">Attendance</a></li>
  <li><a data-nav="sfstudentinfo001.w" href="javascript:void(0)" style="color:#fff">Student Info</a></li>
  <li><a data-nav="sffoodservice001.w" href="javascript:void(0)" style="color:#fff">Food Service</a></li>
  <li><a data-nav="sfschedule001.w" href="javascript:void(0)" style="color:#fff">Schedule</a></li>
  <li><a data-nav="sftestscores001.w" href="javascript:void(0)" style="color:#fff">Test Scores</a></li>
  <li><a href="javascript:void(0)" style="color:#fff">Logout</a></li>
</ul>
<!-- Skyward keeps the session in hidden fields like these. -->
<form id="sf_SessionForm" style="display:none"><input type="hidden" name="encses" value="mock123"><input type="hidden" name="dwd" value="d1"><input type="hidden" name="wfaacl" value="w1"><input type="hidden" name="gridSortState" value="ignore-me"></form>
<div id="sf_StudentLabel">Test Student</div>
<div id="grid_stuGradesGrid_12345_2026" class="sf_gridTableWrap"><div class="wrap">
<table id="grid_stuGradesGrid_12345_2026_gradeGrid_lockedtable"><thead><tr><th>Class</th></tr></thead><tbody id="left"></tbody></table>
<table id="grid_stuGradesGrid_12345_2026_gradeGrid"><thead><tr id="hdr"></tr></thead><tbody id="right"></tbody></table>
</div></div>

<script>
var terms=['Q1','Q2','SM1','SM1 EOC','Q3','Q4','SM2','SM2 EOC','FIN'];
var CUR=1; // Q2 is highlighted as the current term, like real Skyward
var classes=[
 ['English 1','Alexandra Santiago','1','7:19 AM-8:16 AM',[89,100,95,null,null,null,null,null,95]],
 ['Pre-Advanced Placement World History and Geography','Kelsa Gratereaux','2','8:20 AM - 9:10 AM',[83,0,null,null,null,null,null,null,null]],
 ['Forensic Science 1','Sarah Santiago','3','9:14 AM - 10:04 AM',[95,100,98,null,null,null,null,null,98]],
 ['Biology 1','Shayna Carr','4B','10:38 AM - 11:28 AM',[98,0,49,null,null,null,null,null,49],'split'],
 ['Leadership Skills Development','Sofia Vance','5','11:32 AM - 12:22 PM',[90,100,95,null,null,null,null,null,95]],
 ['Spanish 1','Marlise Linauer','6','12:26 PM-1:16 PM',[90,0,null,null,null,null,null,null,null]],
 ['Geometry','Colleen Scroggins','7','1:20 PM - 2:10 PM',[90,100,95,null,null,null,null,null,95]],
 // SWARM is Period 8 in Skyward, with no time or grades of its own.
 ['SWARM','Daniel Reyes','8','',[null,null,null,null,null,null,null,null,null]]];
document.getElementById('hdr').innerHTML=terms.map(t=>'<th>'+t+'</th>').join('');
classes.forEach(function(c,i){
 var left = c[5]==='split'
   // Name alone in its cell; period and a plain-text teacher in the next cell.
   ? '<tr><td scope="row"><span class="bld classDesc"><a href="javascript:void(0)">'+c[0]+'</a></span></td><td>Period '+c[2]+' ('+c[3]+') '+c[1]+'</td></tr>'
   : '<tr><td scope="row" colspan="2"><div class="gb_classDesc"><span class="bld classDesc"><a href="javascript:void(0)">'+c[0]+'</a></span> <label class="bld">Period</label> '+c[2]+' '+(c[3]?'<span class="fXs">('+c[3]+')</span>':'')+' <a href="javascript:void(0)">'+c[1]+'</a></div></td></tr>';
 document.getElementById('left').insertAdjacentHTML('beforeend',left);
 document.getElementById('right').insertAdjacentHTML('beforeend','<tr>'+c[4].map(function(g,j){return '<td'+(j===CUR?' style="background:#fff3b0"':'')+'>'+(g==null?'&nbsp;':'<a id="showGradeInfo" href="javascript:void(0)" data-cni="'+(9000+i)+'" data-lit="'+terms[j]+'">'+g+'</a>')+'</td>'}).join('')+'</tr>');
});
// Grade click: Skyward-style popup that says "Loading" first, then fills in.
document.addEventListener('click',function(e){
  var a=e.target.closest('#showGradeInfo'); if(!a) return;
  var d=document.createElement('div'); d.className='ui-dialog'; d.style.cssText='position:fixed;top:15%;left:25%;width:50%;background:#fff;border:2px solid #345;padding:10px;z-index:10';
  d.innerHTML='<div class="ui-dialog-titlebar"><span class="ui-dialog-title">Loading...</span><a class="ui-dialog-titlebar-close" href="#">X</a></div><div class="body">Loading...</div>';
  document.body.appendChild(d);
  d.querySelector('.ui-dialog-titlebar-close').onclick=function(ev){ev.preventDefault();d.remove();};
  setTimeout(function(){
    var cls=a.closest('tr'); d.querySelector('.ui-dialog-title').textContent='Class Grades: '+a.dataset.lit;
    d.querySelector('.body').innerHTML='<table><thead><tr><th>Due</th><th>Assignment</th><th>Score</th><th>Points Earned</th></tr></thead><tbody>'+
      '<tr><td colspan="4"><b>MAJOR GRADES</b> weighted at 60.00%</td></tr>'+
      '<tr><td>10/02/26</td><td>Unit 2 Test</td><td>88</td><td>44 out of 50</td></tr>'+
      '<tr><td>10/14/26</td><td>Lab Report: Density</td><td>95</td><td>19 out of 20</td></tr>'+
      '<tr><td colspan="4"><b>MINOR GRADES</b> weighted at 40.00%</td></tr>'+
      '<tr><td>10/09/26</td><td>Homework 2.4</td><td>*</td><td>Missing</td></tr>'+
      '<tr><td>10/16/26</td><td>Quiz 3</td><td>72</td><td>18 out of 25</td></tr></tbody></table>';
  },500);
});
// Menu clicks. With ?strict=1 the menu ignores clicks that don't come from
// a real mouse, like the real Skyward does for some people; the app then has
// to post the session fields itself. Otherwise each link uses a different
// way of changing pages so every catch path gets exercised.
var STRICT = /strict=1/.test(location.search);
document.querySelectorAll('#sf_navMenu a[data-nav]').forEach(function(a){
  a.addEventListener('click',function(e){
    if (STRICT && !e.isTrusted) return;
    // Like Skyward: show a busy screen and cursor while the next page loads.
    document.body.insertAdjacentHTML('beforeend',
      '<div class="blockUI blockOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.3);cursor:wait;z-index:5"></div>' +
      '<div style="position:fixed;top:40%;left:40%;z-index:6"><div style="background:#fff;padding:20px;border:1px solid #333">Please wait...</div></div>');
    document.body.classList.add('sf_busy');
    document.body.style.cursor = 'wait';
    var page='pages/'+a.dataset.nav.replace('.w','.html');
    if (a.dataset.nav==='sfschedule001.w') { location.href=page+'?encses=mock123'; return; }
    // Like some Skyward links: the session rides in the address itself.
    if (a.dataset.nav==='sftestscores001.w') { location.href='sftestscores001.w?encses=mock123'; return; }
    var f=document.createElement('form'); f.method='get'; f.action=page;
    f.innerHTML='<input type="hidden" name="encses" value="mock123">'; document.body.appendChild(f); f.submit();
  });
});
</script></body></html>
