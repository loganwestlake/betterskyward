<!doctype html><html><head><meta charset="utf-8"><title>Skyward Family Access</title></head><body style="font:14px Arial;background:#e9eef3">
<!-- Practice copy of Skyward's sign-in page. Any name and password work. -->
<form action="sfhome01.html" method="get" style="width:280px;margin:80px auto;padding:20px;background:#fff;border:1px solid #9ab">
  <h2 style="margin-top:0">Family Access</h2>
  <p><label>Login ID<br><input name="login" id="login" autocomplete="username"></label></p>

  <button id="bSignIn" type="submit">Sign In</button>
</form>
</body></html>
